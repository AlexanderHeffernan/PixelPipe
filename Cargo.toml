[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/pixelate-core",
  "crates/pixelate-project",
  "crates/pixelate-app",
  "crates/pixelate-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlexanderHeffernan/Pixelate"

[workspace.dependencies]
atomicwrites = "0.4"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
png = "0.17"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
thiserror = "2"
tempfile = "3"
toml = "0.8"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
minisign-verify = "0.2.5"
base64 = "0.22"
tauri = { version = "2.11.5", features = ["macos-private-api"] }
tauri-build = "2.6.3"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
