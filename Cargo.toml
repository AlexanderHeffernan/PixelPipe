[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/pixelpipe-core",
  "crates/pixelpipe-project",
  "crates/pixelpipe-app",
  "crates/pixelpipe-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlexanderHeffernan/PixelPipe"

[workspace.dependencies]
atomicwrites = "0.4"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tiff", "webp"] }
png = "0.17"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
toml = "0.8"
base64 = "0.22"
tauri = { version = "2.11.5", features = ["macos-private-api"] }
tauri-build = "2.6.3"
tauri-plugin-dialog = "2.7.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
